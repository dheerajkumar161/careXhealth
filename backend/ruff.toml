line-length = 200
target-version = "py312"
extend-exclude = ["alembic/versions", ".venv"]

[lint]
select = ["E", "F", "W", "B", "UP", "S105", "S106", "S608"]
ignore = ["E501", "E701", "B008", "UP037"]

[lint.per-file-ignores]
"tests/*" = ["S105", "S106", "E402", "F811"]
"scripts/*" = ["E402", "S105", "S106"]  # the demo seed password is intentional
"app/core/config.py" = ["S105"]  # placeholder secret; refused at startup when ENVIRONMENT=production
